name: Build and deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:        
  build-and-deploy:
    runs-on: ubuntu-latest

    # Added for CodeQL as this is a fork.
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix: 
        language: [ 'csharp' ]
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
          
      # CodeQL needs a clean build.
      # is this really necesary??? try removing this. 
      - name: Clean
        run: dotnet clean
        
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Reqnroll acceptance tests
        run: dotnet test BPCalculator.ReqnrollTests/BPCalculator.ReqnrollTests.csproj --configuration Release --no-build

      # run sonar cloud analyis (report in https://sonarcloud.io/project/overview?id=okeeman_BloodPressureCalculator)
      - name: Analyze code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >
            -Dsonar.organization=okeeman
            -Dsonar.projectKey=okeeman_BloodPressureCalculator
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: CodeQL autobuild
        uses: github/codeql-action/autobuild@v4

      # All CodeQL Actions must be the same version number.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security"



     ##### Publish, create .zip
      - name: Publish
        env:
          DOTNET_PUBLISH_DIR: ${{ github.workspace }}/publish
        run: dotnet publish -c Release -o $DOTNET_PUBLISH_DIR
    
      - name: Deploy to Azure Web App
        id: primary
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish  

     ##### Playwright
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').dependencies['@playwright/test'].version)")" >> $GITHUB_ENV
        
      - name: Cache playwright binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }} 
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
 
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: BPCalculatorE2EPlaywright

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: BPCalculatorE2EPlaywright/playwright-report/
          if-no-files-found: error
          retention-days: 30

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.6.0'

      - name: Run k6 load test
        run: npm run loadtest:cloud
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }} 
