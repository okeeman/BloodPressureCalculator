name: Build and deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
  AZURE_RESOURCE_GROUP: BloodPressureResourceGroup
  URI: https://bloodpressurewebapp-hnd9b7dafpfeawa7.francecentral-01.azurewebsites.net/
  STAGING_URI: https://bloodpressurewebapp-staging-dkf8e2c5eyarfmdp.francecentral-01.azurewebsites.net/

jobs:
  lint-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish BPCalculator/BPCalculator.csproj --configuration Release --no-build --output publish

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            **/bin/Release/**
            **/obj/**
          if-no-files-found: error
          retention-days: 1

      - name: Upload web app package
        uses: actions/upload-artifact@v7
        with:
          name: webapp-package
          path: publish/
          if-no-files-found: error
          retention-days: 1

  unit-acceptance-tests:
    runs-on: ubuntu-latest
    needs: lint-build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests with coverage
        run: dotnet test TestBPCalculator/BPCalculatorUnitTests.csproj --configuration Release --coverage --coverage-output "${{ github.workspace }}/coverage/unit.cobertura.xml" --coverage-output-format cobertura

      - name: Run Reqnroll acceptance tests with coverage
        run: dotnet test BPCalculator.ReqnrollTests/BPCalculator.ReqnrollTests.csproj --configuration Release --coverage --coverage-output "${{ github.workspace }}/coverage/reqnroll.cobertura.xml" --coverage-output-format cobertura

      - name: Upload C# coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: csharp-coverage
          path: coverage/*.cobertura.xml
          if-no-files-found: error
          retention-days: 1

  codeql:
    runs-on: ubuntu-latest
    needs: lint-build
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security"
          output: codeql-results

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          if-no-files-found: warn

  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Set Dependency-Check cache key
        id: dependency-check-cache-key
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency-Check data
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Validate NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::The NVD_API_KEY GitHub Actions secret is required. Add or update it in repository or environment secrets."
            exit 1
          fi

          if ! status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apiKey: $NVD_API_KEY" \
            'https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1'); then
            echo "::error::Could not validate NVD_API_KEY because the NVD API request failed."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error::NVD rejected NVD_API_KEY (HTTP $status). Replace the GitHub Actions secret with a valid NVD API key."
            exit 1
          fi

      - name: Update Dependency-Check data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ runner.temp }}/dependency-check-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:13.0.0 \
            --updateonly \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdMaxRetryCount 3 \
            --nvdValidForHours 24

      - name: Save Dependency-Check data cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}

      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${{ runner.temp }}/dependency-check-data:/usr/share/dependency-check/data" \
            -v "${{ github.workspace }}/dependency-check-report:/report" \
            owasp/dependency-check:13.0.0 \
            --scan /src/BPCalculator \
            --scan /src/BPCalculator.ReqnrollTests \
            --scan /src/BPCalculatorE2EPlaywright \
            --scan /src/SeleniumTests \
            --scan /src/TestBPCalculator \
            --scan /src/package-lock.json \
            --format HTML \
            --format SARIF \
            --noupdate \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdMaxRetryCount 3 \
            --nvdValidForHours 24 \
            --out /report

      - name: Upload Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          if-no-files-found: warn

      - name: Upload SARIF
        if: ${{ success() && hashFiles('dependency-check-report/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dependency-check-report/dependency-check-report.sarif

  sonar-cloud:
    runs-on: ubuntu-latest
    needs:
      - lint-build
      - codeql
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Download C# coverage reports
        uses: actions/download-artifact@v4
        with:
          name: csharp-coverage
          path: coverage

      - name: Analyze code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        with:
          args: >
            -Dsonar.organization=okeeman
            -Dsonar.projectKey=okeeman_BloodPressureCalculator
            -Dsonar.cs.cobertura.reportsPaths=coverage/*.cobertura.xml
            -Dsonar.verbose=true
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,playwright/**,k6/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  azure-deploy-staging:
    runs-on: ubuntu-latest
    needs:
      - lint-build
      - unit-acceptance-tests
      - codeql
      - dependency-check
      - sonar-cloud
    permissions:
      contents: read
      id-token: write
    outputs:
      web-app-name: ${{ steps.deploy-infrastructure.outputs.web-app-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download web app package
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: publish

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure
        id: deploy-infrastructure
        run: |
          web_app_name="$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "blood-pressure-infrastructure-${{ github.run_id }}" \
            --template-file infra/app-service.bicep \
            --parameters infra/app-service.bicepparam \
            --query 'properties.outputs.webAppName.value' \
            --output tsv)"
          echo "web-app-name=$web_app_name" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: ${{ steps.deploy-infrastructure.outputs.web-app-name }}
          package: publish
          slot-name: staging

  selenium-tests:
    runs-on: ubuntu-latest
    needs: azure-deploy-staging
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run Selenium tests
        run: xvfb-run --auto-servernum dotnet test SeleniumTests/SeleniumTests.csproj --configuration Release
        env:
          BASE_URL: ${{ env.STAGING_URI }}

  playwright-tests:
    runs-on: ubuntu-latest
    needs: azure-deploy-staging
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: BPCalculatorE2EPlaywright
        env:
          BASE_URL: ${{ env.STAGING_URI }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: playwright-report
          path: BPCalculatorE2EPlaywright/playwright-report/
          if-no-files-found: warn
          retention-days: 30

  k6-load-test:
    runs-on: ubuntu-latest
    needs: 
      - playwright-tests
      - selenium-tests
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.6.0'

      - name: Run k6 load test
        run: npm run loadtest:cloud
        env:
          BASE_URL: ${{ env.STAGING_URI }}
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}

  zap-baseline:
    runs-on: ubuntu-latest
    needs: k6-load-test
    permissions:
      contents: read

    steps:
      - name: Create ZAP report directory
        run: mkdir -p zap-report

      - name: Pull Docker image for ZAP
        run: docker pull zaproxy/zap-weekly

      - name: Run baseline scan
        run: docker run --rm -v "${{ github.workspace }}/zap-report:/zap/wrk/:rw" --user root -t zaproxy/zap-weekly zap-baseline.py -t "${{ env.URI }}" -I -r zapreport.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ZAPreport
          path: zap-report/zapreport.html
          if-no-files-found: warn

  swap-production:
    needs:
      - azure-deploy-staging
      - zap-baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Azure Login
      uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc
      with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Swap slots
      run: |
        az webapp deployment slot swap \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --name "${{ needs.azure-deploy-staging.outputs.web-app-name }}" \
          --slot staging \
          --target-slot production
