name: Build, test, analyze, and deploy

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-test-analyze-deploy:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install SonarScanner for .NET
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner begin /k:"okeeman_BloodPressureCalculator" /o:"okeeman" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Restore solution
        run: dotnet restore BPCalculator.sln

      - name: Build solution
        run: dotnet build BPCalculator.sln --configuration Release --no-restore



     ##### Publish, create .zip
      - name: Publish
        env:
          DOTNET_PUBLISH_DIR: ${{ github.workspace }}/publish
        run: dotnet publish -c Release -o $DOTNET_PUBLISH_DIR
    
      - name: Deploy to Azure Web App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish

     ##### Playwright
      - name: Install Playwright browsers
        run: |
          # Changing directory here. Remember to change back after the Playwright tests if there are more steps.
          # improve performance by: caching browser download, nuget packages, break steps out into jobs, target release.
          # steps run in sequence, jobs run in parallel.
          cd BPCalculatorE2EPlaywright
          pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run tests
        run: dotnet test
   ### End Playwright    
   # Run Selenium tests
      - name: Run Selenium tests
        run: dotnet test ${{ github.workspace }}/publish/SeleniumTests.dll /Settings:SeleniumTest.runsettings --logger:"trx;LogFileName=selenium.trx"
