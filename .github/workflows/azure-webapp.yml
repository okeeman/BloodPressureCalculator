name: Build and deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:        
  build-and-deploy:
    runs-on: ubuntu-latest

    # Added for CodeQL as this is a fork.
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix: 
        language: [ 'csharp' ]
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      # CodeQL needs a clean build.
      - name: Clean
        run: dotnet clean
        
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # run sonar cloud analyis (report in https://sonarcloud.io/project/overview?id=okeeman_BloodPressureCalculator)
      - name: Analyze code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >
            -Dsonar.organization=okeeman
            -Dsonar.projectKey=okeeman_BloodPressureCalculator
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: CodeQL autobuild
        uses: github/codeql-action/autobuild@v4

      # All CodeQL Actions must be the same version number.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security"

      - name: Publish
        env:
          DOTNET_PUBLISH_DIR: ${{ github.workspace }}/publish
        run: dotnet publish -c Release -o $DOTNET_PUBLISH_DIR

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish

  playwright:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - run: npx playwright test
        env:
          BASE_URL: https://bloodpressurewebapp-dshyerhxb9h4bwgk.italynorth-01.azurewebsites.net/
