name: Build, test, analyze, and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-test-analyze-deploy:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install SonarScanner for .NET
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner begin /k:"okeeman_BloodPressureCalculator" /o:"okeeman" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Restore solution
        run: dotnet restore BPCalculator.sln

      - name: Build solution
        run: dotnet build BPCalculator.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test TestBPCalculator/BPCalculatorUnitTests.csproj --configuration Release --no-build --no-restore

      - name: Set up Chrome for Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Install Playwright browsers
        run: pwsh BPCalculatorE2EPlaywright/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start web app
        run: |
          nohup dotnet BPCalculator/bin/Release/net9.0/BPCalculator.dll --urls http://127.0.0.1:5000 > "$RUNNER_TEMP/bpc-calculator.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/bpc-calculator.log"
          exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
          SELENIUM_BASE_URL: http://127.0.0.1:5000
        run: dotnet test BPCalculatorE2EPlaywright/BPCalculatorE2EPlaywright.csproj --configuration Release --no-build --no-restore

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: security

      - name: End SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish BPCalculator/BPCalculator.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
