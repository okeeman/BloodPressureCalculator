name: Build and deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
  URI: https://bloodpressurewebapp-dshyerhxb9h4bwgk.italynorth-01.azurewebsites.net/

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Clean
        run: dotnet clean

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Reqnroll acceptance tests
        run: dotnet test BPCalculator.ReqnrollTests/BPCalculator.ReqnrollTests.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish BPCalculator/BPCalculator.csproj --configuration Release --no-build --output publish

      - name: Upload web app package
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: publish/
          if-no-files-found: error
          retention-days: 1

  code-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Clean
        run: dotnet clean

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Analyze code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >
            -Dsonar.organization=okeeman
            -Dsonar.projectKey=okeeman_BloodPressureCalculator
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: CodeQL autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - code-analysis
    permissions:
      contents: read

    steps:
      - name: Download web app package
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

  selenium-tests:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Selenium tests
        run: xvfb-run --auto-servernum dotnet test SeleniumTests/SeleniumTests.csproj --configuration Release
        env:
          BASE_URL: ${{ env.URI }}

  playwright-tests:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: BPCalculatorE2EPlaywright
        env:
          BASE_URL: ${{ env.URI }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: BPCalculatorE2EPlaywright/playwright-report/
          if-no-files-found: warn
          retention-days: 30

  k6-load-test:
    runs-on: ubuntu-latest
    needs:
      - selenium-tests
      - playwright-tests
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.6.0'

      - name: Run k6 load test
        run: npm run loadtest:cloud
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}

  zap-baseline:
    runs-on: ubuntu-latest
    needs: k6-load-test
    permissions:
      contents: read

    steps:
      - name: Create ZAP report directory
        run: mkdir -p zap-report

      - name: Pull Docker image for ZAP
        run: docker pull zaproxy/zap-weekly

      - name: Run baseline scan
        run: docker run --rm -v "${{ github.workspace }}/zap-report:/zap/wrk/:rw" --user root -t zaproxy/zap-weekly zap-baseline.py -t "${{ env.URI }}" -I -r zapreport.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ZAPreport
          path: zap-report/zapreport.html
          if-no-files-found: warn
